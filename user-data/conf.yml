---
# Page meta info, like heading, footer text and nav links
pageInfo:
  title: Home
  description: Everything in one place
  navLinks:

# Optional app settings and configuration
appConfig:
  theme: solarized-light
  startingView: minimal
  webSearch:
    searchEngine: startpage

  disableConfigurationForNonAdmin: true

# Main content - An array of sections, each containing an array of items
sections:
  - name: Internal Apps
    icon: fas fa-server
    items:
      - title: Coolify
        description: Application deployment platform
        url: https://coolify.aes.my.id
        icon: fas fa-cloud
      - title: authentik
        description: Identity provider and access management
        url: https://auth.aes.my.id
        icon: fas fa-shield-alt
      - title: Pi-hole
        url: http://pi.hole
        description: Network-wide ad blocking DNS
        icon: fas fa-wifi

  - name: External Apps
    icon: fas fa-globe
    displayData:
      itemSize: large
    items:
      - title: GitHub

  - name: Updates
    icon: fas fa-rss
    displayData:
      cols: 1
      rows: 3
      cutToHeight: true
    widgets:
      - type: rss-feed
        options:
          rssUrl: https://github.com/lissy93/dashy/releases.atom
          limit: 5

  - name: Tools
    icon: fas fa-tools
    items:
      - title: IT Tools
        url: https://it-tools.tech/
        icon: fas fa-tools
      - title: Code Converter
        url: https://codebeautify.org/
        icon: fas fa-code
      - title: JSON Viewer
        url: https://jsonviewer.stack.hu/
        icon: fas fa-list