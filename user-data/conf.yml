---
# Page meta info, like heading, footer text and nav links
pageInfo:
  title: Home
  description: Everything in one place
  navLinks:

# Optional app settings and configuration
appConfig:
  theme: solarized-light
  startingView: minimal
  webSearch:
    searchEngine: startpage

  disableConfigurationForNonAdmin: true

# Main content - An array of sections, each containing an array of items
sections:
  - name: Internal Apps
    icon: fas fa-server
    items:
      - title: Coolify
        description: Application deployment platform
        url: https://coolify.aes.my.id
        icon: fas fa-cloud
      - title: authentik
        description: Identity provider and access management
        url: https://auth.aes.my.id
        icon: fas fa-shield-alt

  - name: External Apps
    icon: fas fa-globe
    displayData:
      itemSize: large
    items:
      - title: GitHub
        url: https://github.com/aessaputra
        description: Source Code and Issues
        icon: si-github
      - title: Sponsor
        url: https://github.com/sponsors/aessaputra
        description: Sponsor @aessaputra on GitHub to support with ongoing development of Dashy
        icon: 🩷
        color: '#ff78d1'
        backgroundColor: '#c30c844a'

  - name: Updates
    icon: fas fa-rss
    displayData:
      cols: 1
      rows: 3
      cutToHeight: true
    widgets:
      - type: rss-feed
        options:
          rssUrl: https://github.com/lissy93/dashy/releases.atom
          limit: 5

  - name: Tools
    icon: fas fa-tools
    items:
      - title: IT Tools
        url: https://it-tools.tech/
        icon: fas fa-tools
      - title: Code Converter
        url: https://codebeautify.org/
        icon: fas fa-code
      - title: JSON Viewer
        url: https://jsonviewer.stack.hu/
        icon: fas fa-list